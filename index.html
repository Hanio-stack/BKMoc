<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK Combat Mock — Rooms / Melee / Rising</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- デバッグHUD -->
<div id="hud">
  <div>STATE: <span id="hudState">HUMAN</span></div>
  <div>Room: <span id="hudRoom">HUB</span></div>
  <div>Selected Target: <span id="hudTarget">NONE</span></div>
  <div>Parts: <span id="hudArms">0 air / 0 ground</span></div>
  <div>Enemy: <span id="hudEnemy">-</span></div>
</div>

<!-- クロスヘア -->
<div id="crosshair"></div>

<!-- 切断ターゲット / 敵ステータスバー / 胸元プロンプトはmain.jsが動的生成 -->

<!-- スロー演出 -->
<div id="slowOverlay" class="hidden"></div>
<div id="slowLabel" class="hidden">SLOW</div>

<!-- ライジングモード表示 -->
<div id="risingLabel" class="hidden">RISING</div>

<!-- 汎用フラッシュ -->
<div id="flash"></div>

<!-- 判定フィードバック -->
<div id="feedback"></div>

<!-- ボス戦（ダクトの男） -->
<div id="scareVignette"></div>
<div id="bossHud" class="hidden">
  <div class="boss-top"><span id="bossName">DUCT MAN</span><span id="bossRound">ROUND 1 / 3</span></div>
  <div id="bossBar"><i id="bossBarFill"></i></div>
</div>
<div id="bossCount" class="hidden">10.0</div>
<div id="subtitle" class="hidden"></div>

<!-- デモステージ（一本道のウェーブ戦） -->
<div id="demoHud" class="hidden">
  <span id="demoWave">WAVE 1 / 5</span>
  <span id="demoLeft">ADVANCE</span>
</div>

<!-- プレイヤーステータス（左右下＝腕 / 中央下＝体・頭 ＋ リソース） -->
<div id="playerHud">
  <div class="hud-slot arm" id="slotArmL">
    <div class="hp-circle" id="circleArmL"><i class="fill"></i><span class="num">100</span></div>
    <div class="slot-tag" id="tagArmL">FIST</div>
  </div>

  <div class="hud-slot core" id="slotCore">
    <div class="slot-tag" id="tagCore">BODY</div>
    <div class="hp-circle" id="circleCore"><i class="fill"></i><span class="num">100</span></div>
    <div id="resPips"></div>
  </div>

  <div class="hud-slot arm" id="slotArmR">
    <div class="hp-circle" id="circleArmR"><i class="fill"></i><span class="num">100</span></div>
    <div class="slot-tag" id="tagArmR">FIST</div>
  </div>
</div>

<!-- 操作説明（腕の棚の横の看板をFでインタラクト）-->
<div id="manual" class="hidden">
  <div class="manual-side left"><span class="mkey">A</span><span class="marrow">&#9664;</span><span class="mcap">前</span></div>
  <div class="manual-box">
    <div class="manual-head">
      <span id="manualCat">CATEGORY</span>
      <span id="manualCount">1 / 1</span>
    </div>
    <div id="manualArt"></div>
    <div id="manualTitle">TITLE</div>
    <div id="manualKeys"></div>
    <div id="manualDesc"></div>
    <div id="manualDots"></div>
    <div class="manual-foot"><span class="mkey">F</span> 閉じる</div>
  </div>
  <div class="manual-side right"><span class="mcap">次</span><span class="marrow">&#9654;</span><span class="mkey">D</span></div>
</div>

<!-- スタート／ポーズオーバーレイ -->
<div id="startOverlay">
  <div class="start-box">
    <div class="start-title">BRAIN KEEPER — COMBAT FLOW MOCK</div>
    <div class="start-sub">クリックして開始（マウスをロックします / ESCで解除）</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
